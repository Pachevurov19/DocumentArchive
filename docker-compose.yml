services:
  archive-api:
    build:
      context: .
      dockerfile: Archive.Api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__ArchiveDatabase: "Data Source=/app/data/archive.db"
      Storage__Path: /app/data/storage
    volumes:
      - archive-data:/app/data
    restart: unless-stopped

  export-api:
    build:
      context: .
      dockerfile: Export.Api/Dockerfile
    ports:
      - "8082:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ArchiveApi__BaseUrl: http://archive-api:8080
    depends_on:
      - archive-api
    restart: unless-stopped

volumes:
  archive-data:
